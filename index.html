<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Surprise</title>
    <style>
      :root {
        --bg-color: #fdf2f2;
        --card-white: #ffffff;
        --accent: #e91e63;
        --text: #444;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--bg-color);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      /* 3D Container */
      .scene {
        width: 90vw;
        height: 80vh;
        max-width: 400px;
        perspective: 1500px;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
        cursor: pointer;
      }

      /* When clicked/active, flip the card */
      .card.is-flipped {
        transform: rotateY(180deg);
      }

      /* Shared Page Styles */
      .page {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        padding: 25px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background: var(--card-white);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      /* FRONT PAGE: Photos and Main Message */
      .page-front {
        background-image: url("bd-main.jpg");
        background-size: 100% auto;
        background-position: center;
        z-index: 2;
      }

      .header-text {
        text-align: center;
        margin-bottom: 20px;
      }

      .header-text h1 {
        font-size: 1.5rem;
        color: var(--accent);
        margin: 0;
      }

      .header-text p {
        font-size: 0.9rem;
        color: var(--text);
        margin-top: 5px;
        line-height: 1.4;
      }

      .friends-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        flex-grow: 1;
      }

      .friend-img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        border-radius: 12px;
        background: #eee;
      }

      .tap-hint {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-size: 0.8rem;
        color: #888;
        font-style: italic;
      }

      /* BACK PAGE: Short Message and Ring */
      .page-back {
        transform: rotateY(180deg);
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .ring-container {
        width: 100%;
        height: 60%;
        border-radius: 15px;
        overflow: hidden;
        margin: 20px 0;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }

      .ring-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .final-note {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--accent);
      }

      .back-hint {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7rem;
        margin-top: 10px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="card" id="card" onclick="this.classList.toggle('is-flipped')">
        <!-- FRONT SIDE: Friends & Message -->
        <div class="page page-front">
          <div class="tap-hint">Нажми для получения подарка</div>
        </div>

        <!-- BACK SIDE: Ring & Short Message -->
        <div class="page page-back">
          <div class="ring-container">
            <!-- Replace this with your Ring photo link -->
            <img src="ring.jpg" class="ring-img" alt="The Gift" />
          </div>

          <div class="final-note">
            Надеемся, что оно светится так ярко, как ты!
          </div>
          <div class="back-hint">Нажми для переворота</div>
        </div>
      </div>
    </div>
  </body>
</html>
