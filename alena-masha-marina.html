<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Surprise</title>
    <style>
      :root {
        --bg-color: #f3e8d2;
        --card-white: #ffffff;
        --accent: #e91e63;
        --text: #444;
      }

      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--bg-color);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* 3D Container */
      .scene {
        width: 90vw;
        perspective: 1500px;
      }

      .card {
        position: relative;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
        cursor: pointer;
      }

      /* When clicked/active, flip the card */
      .card.is-flipped {
        transform: rotateY(180deg);
      }

      /* Shared Page Styles */
      .page {
        backface-visibility: hidden;
        border-radius: 20px;
      }

      /* FRONT PAGE: Photos and Main Message */
      .page-front {
        z-index: 2;
      }

      .tap-hint {
        position: absolute;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-size: 0.8rem;
        color: #888;
        font-style: italic;
      }

      .ring-img {
        display: inline-block;
        width: 100%;
      }

      /* BACK PAGE: Short Message and Ring */
      .page-back {
        position: absolute;
        top: 0;
        transform: rotateY(180deg);
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .back-hint {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="card" id="card" onclick="this.classList.toggle('is-flipped')">
        <!-- FRONT SIDE: Friends & Message -->
        <div class="page page-front">
          <img src="frontside.jpg" class="ring-img" alt="The Gift" />
        </div>

        <!-- BACK SIDE: Ring & Short Message -->
        <div class="page page-back">
          <!-- Replace this with your Ring photo link -->
          <img src="backside.jpg" class="ring-img" alt="The Gift" />
        </div>
      </div>
      <div class="back-hint">Нажми для переворота</div>
    </div>
  </body>
</html>
